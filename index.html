<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawtar &amp; Mohamed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --beige:#F1E7DA;
    --beige-deep:#E4D5C2;
    --burgundy:#7C2A31;
    --burgundy-dark:#5A1E23;
    --ink:#3A2E28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--beige);
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
  }
  .page{
    max-width:640px;
    margin:0 auto;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  .invite-img{
    display:block;
    width:100%;
    height:auto;
  }
  .countdown-section{
    background:linear-gradient(180deg, var(--beige) 0%, var(--beige-deep) 100%);
    padding:30px 30px 44px;
    text-align:center;
    position:relative;
  }
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
  }
  .divider .line{
    height:1px;
    width:70px;
    background:var(--burgundy);
    opacity:0.55;
  }
  .divider .diamond{
    width:7px;height:7px;
    background:var(--burgundy);
    transform:rotate(45deg);
    opacity:0.8;
  }
  .cd-title{
    font-family:'Alex Brush', cursive;
    font-size:34px;
    color:var(--burgundy);
    margin:0 0 4px;
    line-height:1;
  }
  .cd-sub{
    font-size:13px;
    letter-spacing:0.16em;
    color:var(--ink);
    opacity:0.75;
    margin:0 0 24px;
  }
  .countdown{
    display:flex;
    justify-content:center;
    gap:clamp(10px,4vw,26px);
    flex-wrap:nowrap;
  }
  .unit{
    min-width:58px;
  }
  .num{
    font-size:clamp(34px,8vw,48px);
    font-weight:600;
    color:var(--burgundy-dark);
    line-height:1;
  }
  .txt{
    margin-top:6px;
    font-size:11px;
    letter-spacing:0.13em;
    color:var(--ink);
    opacity:0.7;
  }
  .sep{
    font-size:clamp(24px,6vw,34px);
    color:var(--burgundy);
    opacity:0.4;
    align-self:flex-start;
    margin-top:2px;
  }
  .footer-note{
    margin-top:26px;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--ink);
    opacity:0.65;
    font-style:italic;
  }
</style>
</head>

  var weddingDate = new Date("2026-10-24T16:00:00");
  function updateCountdown(){

    var diff = weddingDate - now;
    if(diff < 0) diff = 0;
    var days = Math.floor(diff / (1000*60*60*24));
    var hours = Math.floor((diff / (1000*60*60)) % 24);
    var mins = Math.floor((diff / (1000*60)) % 60);

  }
