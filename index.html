<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawtar & Mohamed</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
</head>

<body>
  <main class="page">

    <!-- Replace invitation.png with your wedding invitation image -->
    <img class="invite-img" src="invitation.png" alt="Invitation de mariage de Kawtar et Mohamed">

    <section class="countdown-section">
      <div class="divider">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>

      <h1 class="cd-title"> Compte à rebours </h1>
      <p class="cd-sub"> Le grand jour approche... </p>

      <div class="countdown" id="countdown">
        <div class="unit">
          <div class="num" id="days">00</div>
          <div class="txt">JOURS</div>
        </div>

        <div class="sep">:</div>

        <div class="unit">
          <div class="num" id="hours">00</div>
          <div class="txt">HEURES</div>
        </div>

        <div class="sep">:</div>

        <div class="unit">
          <div class="num" id="minutes">00</div>
          <div class="txt">MINUTES</div>
        </div>

        <div class="sep">:</div>

        <div class="unit">
          <div class="num" id="seconds">00</div>
          <div class="txt">SECONDES</div>
        </div>
      </div>

      <p class="footer-note"> Avec tout notre amour, Kawtar & Mohamed 🤎 </p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
